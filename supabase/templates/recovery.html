<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
  </head>
  <body
    style="
      margin: 0;
      background: #070d18;
      color: #f4f1ec;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #070d18; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 620px;
              background: #0f1b2d;
              border: 1px solid rgba(255, 255, 255, 0.08);
            "
          >
            <tr>
              <td style="padding: 34px">
                <p
                  style="
                    margin: 0 0 18px;
                    color: #c9a84c;
                    font-size: 11px;
                    font-weight: 700;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                  "
                >
                  Fluent with Sena
                </p>
                <h1
                  style="
                    margin: 0;
                    color: #f4f1ec;
                    font-size: 30px;
                    line-height: 1.15;
                    font-weight: 700;
                  "
                >
                  Reset your password
                </h1>
                <p
                  style="
                    margin: 18px 0 24px;
                    color: rgba(244, 241, 236, 0.72);
                    font-size: 15px;
                    line-height: 1.7;
                  "
                >
                  Use the button below to choose a new password for your Fluent with Sena dashboard.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background: #c9a84c;
                    color: #070d18;
                    text-decoration: none;
                    font-size: 12px;
                    font-weight: 700;
                    letter-spacing: 1.6px;
                    text-transform: uppercase;
                    padding: 15px 22px;
                  "
                  >Reset Password</a
                >
                <p
                  style="
                    margin: 22px 0 0;
                    color: rgba(244, 241, 236, 0.48);
                    font-size: 13px;
                    line-height: 1.65;
                  "
                >
                  If you did not request this, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
